<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MetroLeads CRM — Contact Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0b0f1a;
      --surface: #131929;
      --card: #1a2235;
      --border: #243050;
      --accent: #3b82f6;
      --accent2: #06b6d4;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --text: #e2e8f0;
      --muted: #64748b;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: var(--font-head);
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .logo span {
      font-weight: 400;
      opacity: 0.6;
      font-size: 0.8rem;
      display: block;
      -webkit-text-fill-color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .btn-add {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      padding: 0.55rem 1.2rem;
      border-radius: 8px;
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-add:hover { opacity: 0.9; transform: translateY(-1px); }

    /* MAIN LAYOUT */
    main { max-width: 1200px; margin: 0 auto; padding: 2rem; }

    /* STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem 1.5rem;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.4s ease both;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }
    .stat-card.total::before { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .stat-card.leads::before { background: var(--yellow); }
    .stat-card.active::before { background: var(--green); }
    .stat-card.closed::before { background: var(--red); }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      font-weight: 500;
    }
    .stat-value {
      font-family: var(--font-head);
      font-size: 2.2rem;
      font-weight: 800;
      margin-top: 0.3rem;
      line-height: 1;
    }

    /* TOOLBAR */
    .toolbar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .search-box {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: var(--accent); }
    .search-box::placeholder { color: var(--muted); }

    .filter-select {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    /* TABLE */
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    thead {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 0.9rem 1.2rem;
      text-align: left;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      font-weight: 600;
    }

    td {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: rgba(59, 130, 246, 0.04); }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 0.85rem;
      margin-right: 10px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .name-cell { display: flex; align-items: center; }
    .name-text { font-weight: 500; }
    .company-sub { font-size: 0.78rem; color: var(--muted); margin-top: 1px; }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .badge-lead { background: rgba(245,158,11,0.15); color: var(--yellow); }
    .badge-active { background: rgba(16,185,129,0.15); color: var(--green); }
    .badge-closed { background: rgba(239,68,68,0.15); color: var(--red); }

    .action-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      margin-right: 4px;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.del:hover { border-color: var(--red); color: var(--red); }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal h2 {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
    }

    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus { border-color: var(--accent); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }

    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.55rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.9rem;
    }
    .btn-cancel:hover { border-color: var(--text); color: var(--text); }

    .btn-save {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      padding: 0.55rem 1.4rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    .btn-save:hover { opacity: 0.9; }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--green);
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      transform: translateY(60px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 999;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { background: var(--red); }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .form-row { grid-template-columns: 1fr; }
      main { padding: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    MetroLeads CRM
    <span>Contact Manager</span>
  </div>
  <button class="btn-add" onclick="openModal()">
    + Add Contact
  </button>
</header>

<main>
  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card total" style="animation-delay:0s">
      <div class="stat-label">Total Contacts</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat-card leads" style="animation-delay:0.1s">
      <div class="stat-label">Leads</div>
      <div class="stat-value" id="stat-leads">0</div>
    </div>
    <div class="stat-card active" style="animation-delay:0.2s">
      <div class="stat-label">Active</div>
      <div class="stat-value" id="stat-active">0</div>
    </div>
    <div class="stat-card closed" style="animation-delay:0.3s">
      <div class="stat-label">Closed</div>
      <div class="stat-value" id="stat-closed">0</div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input type="text" class="search-box" id="searchInput" placeholder="🔍  Search contacts..." oninput="filterContacts()" />
    <select class="filter-select" id="statusFilter" onchange="filterContacts()">
      <option value="">All Status</option>
      <option value="Lead">Lead</option>
      <option value="Active">Active</option>
      <option value="Closed">Closed</option>
    </select>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Added On</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="contactsBody">
        <tr><td colspan="6" class="empty-state">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add New Contact</h2>
    <input type="hidden" id="editId" />
    <div class="form-row">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="fName" placeholder="Rahul Sharma" />
      </div>
      <div class="form-group">
        <label>Company</label>
        <input type="text" id="fCompany" placeholder="TechCorp India" />
      </div>
    </div>
    <div class="form-group">
      <label>Email Address *</label>
      <input type="email" id="fEmail" placeholder="rahul@techcorp.in" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="fPhone" placeholder="9876543210" />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="fStatus">
          <option value="Lead">Lead</option>
          <option value="Active">Active</option>
          <option value="Closed">Closed</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveContact()">Save Contact</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = 'http://localhost:5000/api';
  let allContacts = [];

  const COLORS = ['#3b82f6','#06b6d4','#10b981','#f59e0b','#8b5cf6','#ec4899'];
  const getColor = (name) => COLORS[name.charCodeAt(0) % COLORS.length];

  async function loadContacts() {
    try {
      const res = await fetch(`${API}/contacts`);
      allContacts = await res.json();
      renderContacts(allContacts);
      loadStats();
    } catch {
      showToast('Cannot connect to backend. Run server.js first!', true);
      document.getElementById('contactsBody').innerHTML =
        `<tr><td colspan="6" class="empty-state">⚠️ Backend not running. Start server with: <code>node server.js</code></td></tr>`;
    }
  }

  async function loadStats() {
    try {
      const res = await fetch(`${API}/stats`);
      const s = await res.json();
      document.getElementById('stat-total').textContent = s.total;
      document.getElementById('stat-leads').textContent = s.leads;
      document.getElementById('stat-active').textContent = s.active;
      document.getElementById('stat-closed').textContent = s.closed;
    } catch {}
  }

  function renderContacts(contacts) {
    const tbody = document.getElementById('contactsBody');
    if (!contacts.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No contacts found. Add one!</td></tr>`;
      return;
    }
    tbody.innerHTML = contacts.map(c => {
      const initials = c.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
      const color = getColor(c.name);
      const date = new Date(c.createdAt).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
      const badgeClass = c.status === 'Lead' ? 'badge-lead' : c.status === 'Active' ? 'badge-active' : 'badge-closed';
      return `
        <tr>
          <td>
            <div class="name-cell">
              <div class="avatar" style="background:${color}22;color:${color}">${initials}</div>
              <div>
                <div class="name-text">${c.name}</div>
                <div class="company-sub">${c.company || '—'}</div>
              </div>
            </div>
          </td>
          <td>${c.email}</td>
          <td>${c.phone || '—'}</td>
          <td><span class="badge ${badgeClass}">${c.status}</span></td>
          <td>${date}</td>
          <td>
            <button class="action-btn" onclick="editContact('${c.id}')">✏️ Edit</button>
            <button class="action-btn del" onclick="deleteContact('${c.id}')">🗑️ Delete</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function filterContacts() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const filtered = allContacts.filter(c => {
      const matchSearch = c.name.toLowerCase().includes(search) ||
        c.email.toLowerCase().includes(search) ||
        (c.company || '').toLowerCase().includes(search);
      const matchStatus = !status || c.status === status;
      return matchSearch && matchStatus;
    });
    renderContacts(filtered);
  }

  function openModal(contact = null) {
    document.getElementById('modalTitle').textContent = contact ? 'Edit Contact' : 'Add New Contact';
    document.getElementById('editId').value = contact ? contact.id : '';
    document.getElementById('fName').value = contact ? contact.name : '';
    document.getElementById('fEmail').value = contact ? contact.email : '';
    document.getElementById('fPhone').value = contact ? contact.phone : '';
    document.getElementById('fCompany').value = contact ? contact.company : '';
    document.getElementById('fStatus').value = contact ? contact.status : 'Lead';
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  async function saveContact() {
    const id = document.getElementById('editId').value;
    const body = {
      name: document.getElementById('fName').value.trim(),
      email: document.getElementById('fEmail').value.trim(),
      phone: document.getElementById('fPhone').value.trim(),
      company: document.getElementById('fCompany').value.trim(),
      status: document.getElementById('fStatus').value,
    };

    if (!body.name || !body.email) {
      showToast('Name and Email are required!', true);
      return;
    }

    try {
      const url = id ? `${API}/contacts/${id}` : `${API}/contacts`;
      const method = id ? 'PUT' : 'POST';
      await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      closeModal();
      loadContacts();
      showToast(id ? 'Contact updated!' : 'Contact added!');
    } catch {
      showToast('Error saving contact!', true);
    }
  }

  function editContact(id) {
    const contact = allContacts.find(c => c.id === id);
    if (contact) openModal(contact);
  }

  async function deleteContact(id) {
    if (!confirm('Delete this contact?')) return;
    try {
      await fetch(`${API}/contacts/${id}`, { method: 'DELETE' });
      loadContacts();
      showToast('Contact deleted.');
    } catch {
      showToast('Error deleting contact!', true);
    }
  }

  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (error ? ' error' : '');
    setTimeout(() => t.className = 'toast', 3000);
  }

  // Close modal on overlay click
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  loadContacts();
</script>
</body>
</html>
